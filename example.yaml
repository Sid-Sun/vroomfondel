# Copy to ~/.vroomfondel.yaml and adjust. Alternatively place as
# ~/.config/vroomfondel/vroomfondel.yaml or ~/.config/vroomfondel/config.yaml,
# or pass --config PATH explicitly.
openai:
  api_key: "sk-12345667890abcdefghijkl"
  endpoint: "http://localhost:3000/api/v1/"
ollama:
  # Base host of the Ollama daemon for models with `backend: ollama`.
  # Note: this is NOT a /v1/ suffixed OpenAI-compatible path.
  endpoint: "http://localhost:11434"
models:
  - name: "default"
    model: "llama3:instruct"
    # Backend for this model: "openai" (OpenAI-compatible chat/completions
    # endpoint, the default when omitted) or "ollama" (native Ollama daemon
    # via POST /api/chat using the official ollama/api client).
    backend: "openai"
    # Default system prompt for this model. Overridden per-invocation with
    # -s/--system. Leave unset or empty to use the built-in brief-answer
    # prompt; pass -s "" to send no system message.
    system_prompt: "You are a highly intelligent agent which is invoked from the command line to ask very brief questions and / or to evaluate something. Answer the question EXTREMELY BRIEFLY. Do NOT assume what the user wants to know or try to provide information user has not asked for - answer the question directly and leave it there."
    tweak_level: "basic" # any value but "advanced" is basic.
    # Optional. Passed through to the backend to toggle/tune extended
    # thinking: the OpenAI backend sends it verbatim as "reasoning_effort",
    # the Ollama backend maps it to "think" ("none" disables thinking).
    # Use "none" to disable thinking, or "low"/"medium"/"high" to tune it.
    # Leave unset to omit the field entirely and use the backend's default.
    reasoning_effort: ""
    tweaks:
      context_length: 8192 # mapped to num_ctx on the ollama backend
      max_tokens: 1024 # mapped to num_predict on the ollama backend
      temperature: 0.8
  # Example native Ollama model (uncomment to use):
  # - name: "local"
  #   model: "llama3.1"
  #   backend: "ollama"
  #   tweak_level: "basic"
  #   reasoning_effort: ""
  #   tweaks:
  #     context_length: 8192
  #     max_tokens: 1024
  #     temperature: 0.8
